<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kapicua: anota y sigue las partidas de dominó de tu liga.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kapicua">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kapicua</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Mientras el navegador descarga y arranca el motor de Flutter (antes
      de que exista cualquier widget de Dart) la página se ve en blanco
      unos segundos, más en conexiones lentas — sin esto no había ningún
      indicador durante esa espera. Se retira solo con el evento
      "flutter-first-frame" que el motor dispara apenas pinta el primer
      frame real.
    */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F6F8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #2E6B3F;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid #DCE8DE;
      border-top-color: #2E6B3F;
      animation: app-loading-spin 0.8s linear infinite;
    }
    #app-loading p {
      margin: 0;
      font-size: 15px;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #app-loading {
        background: #10140F;
        color: #8FD4A0;
      }
      #app-loading .spinner {
        border-color: #22301F;
        border-top-color: #8FD4A0;
      }
    }
    #app-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <p>Cargando Kapicua, un momento por favor&hellip;</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.classList.add('hidden');
      loading.addEventListener('transitionend', function () {
        loading.remove();
      });
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
